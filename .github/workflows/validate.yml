name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts syntax (bash -n)
        run: |
          for f in hooks/*.sh scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: JSON validity
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            echo "checking $f"
            python3 -c "import json; json.load(open('$f'))"
          done

      - name: No stale instructions/ references (renamed to workflows/)
        run: |
          if grep -rn "@[^ ]*instructions/" --include="*.md" agents commands skills workflows rules; then
            echo "::error::stale instructions/ reference found — use workflows/"
            exit 1
          fi

      - name: No duplicate root manifests (.claude-plugin/ is canonical)
        run: |
          if [ -f plugin.json ] || [ -f marketplace.json ]; then
            echo "::error::root plugin.json/marketplace.json must not exist"
            exit 1
          fi

      - name: Version consistency (plugin.json == marketplace.json)
        run: |
          PV=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          MV=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['metadata']['version'])")
          PMV=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          echo "plugin=$PV  marketplace.metadata=$MV  marketplace.plugins[0]=$PMV"
          if [ "$PV" != "$MV" ] || [ "$PV" != "$PMV" ]; then
            echo "::error::version mismatch across manifests"
            exit 1
          fi
